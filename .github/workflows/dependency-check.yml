name: OWASP Dependency-Check

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Run OWASP Dependency-Check
        run: ./mvnw -B -Powasp -Dformat=HTML -DnvdApiKey=${{ secrets.NVD_API_KEY }} org.owasp:dependency-check-maven:check

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          if-no-files-found: warn